name: Build iOS App

# iOS 构建 + 上传 TestFlight（App Store Connect API 认证）
# 触发：推 tag `v*-ios`（例：v1.0.0-ios），或手动 workflow_dispatch
# 首次运行前必须先把 secrets 配好（见 skills/doctor-meets-lawyer-ios-release/SKILL.md）：
#   IOS_BUILD_CERTIFICATE_BASE64 / IOS_BUILD_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64 / IOS_PROVISIONING_PROFILE_NAME
#   KEYCHAIN_PASSWORD
#   APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY
# 用 scripts/appstore/setup_github_secrets.py 从本机 keys.txt / ios-signing/ 自动上传。

on:
  push:
    tags:
      - 'v*-ios'
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS IPA & Upload to TestFlight
    # 必须用 Xcode 26（macos-latest）构建：ASC 2026 起拒绝 iOS 26 SDK 以下的上传
    # （macos-15/Xcode 16 编的 iOS 18.5 SDK 会被 altool 409 拒）。但 Xcode 26 默认
    # Swift 6 模式会让 expo-localization 等 pod 报 'switch must be exhaustive' error，
    # 故 archive 时用 SWIFT_VERSION=5.0 强制 Swift 5 语言模式（见 ios-build skill 坑 5）。
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild (generate iOS native project)
        env:
          CI: 1
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      # Xcode 26 的 swiftc 对 non-frozen enum 的 switch 穷尽检查是 error（Swift 6 模式），
      # 即使命令行传 SWIFT_VERSION=5.0 也不影响 Pods target。这里直接改 Pods.xcodeproj：
      # 把所有 SWIFT_VERSION 统一为 5.0；若 Pods 未显式设置，则给 project 级补一行让所有
      # pod target 继承 Swift 5 语言模式（见 doctor-meets-lawyer-ios-build skill 坑 5）。
      - name: Force Swift 5 language mode for Pods
        run: |
          cd ios/Pods/Pods.xcodeproj
          echo "--- before ---"
          grep -n 'SWIFT_VERSION' project.pbxproj | head -20
          perl -0pi -e 's/SWIFT_VERSION = [0-9][0-9.]*;/SWIFT_VERSION = 5.0;/g' project.pbxproj
          if ! grep -q 'SWIFT_VERSION' project.pbxproj; then
            perl -0pi -e 's/(\t\t\t\tobjectVersion = \d+;)/$1\n\t\t\t\tSWIFT_VERSION = 5.0;/' project.pbxproj
          fi
          echo "--- after ---"
          grep -n 'SWIFT_VERSION' project.pbxproj | head -20

      # iOS 26 SDK 的 Foundation 把 Calendar.Identifier 标记为 frozen enum，
      # expo-localization 的 switch 缺 @unknown default 报 error。补一个。
      - name: Patch expo-localization for iOS 26 SDK
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          f = pathlib.Path('node_modules/expo-localization/ios/LocalizationModule.swift')
          src = f.read_text(encoding='utf-8')
          m = re.search(r'case \.iso8601:\n(\s+)return "iso8601"\n', src)
          if not m:
              print('[ERROR] 未找到 iso8601 case，取消补丁')
              sys.exit(1)
          old = m.group(0)
          new = old + '    @unknown default:\n      return ""\n'
          if '@unknown default' not in src:
              f.write_text(src.replace(old, new, 1), encoding='utf-8')
              print('[OK] 已插入 @unknown default')
          else:
              print('[SKIP] 已存在 @unknown default')
          PY
          grep -n -A2 'unknown default' node_modules/expo-localization/ios/LocalizationModule.swift

      - name: Discover workspace & scheme
        id: discover
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Using workspace: $WORKSPACE"
          echo "Using scheme: $SCHEME"

      - name: Setup signing certificates & provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 从 secrets 还原证书与描述文件
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # 创建临时 keychain 并导入分发证书
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # 避免 codesign 交互式提示
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 安装 provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Prepare ExportOptions.plist
        run: |
          cp .github/ios/ExportOptions.plist ios/ExportOptions.plist
          plutil -replace provisioningProfiles -xml "<dict><key>com.richardchung.doctormeetslawyer</key><string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string></dict>" ios/ExportOptions.plist

      - name: Archive iOS app
        # discover 输出的 workspace 是相对仓库根的路径（ios/xxx.xcworkspace），
        # 这里不能再 cd ios（否则变成 ios/ios/xxx 不存在）
        run: |
          xcodebuild -workspace "${{ steps.discover.outputs.workspace }}" \
            -scheme "${{ steps.discover.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=3W8574PF9N \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            SWIFT_VERSION=5.0 \
            archive

      - name: Export IPA
        # ExportOptions.plist 已在 prepare 步骤复制到 ios/（相对仓库根）
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Locate IPA file
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Found IPA at: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-release
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ env.IPA_PATH != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_KEY_ID != '' && env.APPSTORE_PRIVATE_KEY != '' }}
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
